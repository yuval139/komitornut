<title>תורנויות</title>

<meta name="mobile-web-app-capable" content="yes" />

<style>
  html,body{margin:0;padding:0;background:#0e1a2b}
  body{padding-top:env(safe-area-inset-top)}
  /* opening screen: the logo, a gold rule, and the three words */
  #boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
        font-family:Heebo,system-ui,-apple-system,sans-serif;color:#c9a45c;background:radial-gradient(120% 70% at 50% 0%,#17294a 0%,#0e1a2b 55%,#0b1523 100%)}
  #boot .halo{position:absolute;width:520px;height:520px;border-radius:50%;top:50%;left:50%;margin:-300px 0 0 -260px;pointer-events:none;
        background:radial-gradient(circle,rgba(201,164,92,.20) 0%,rgba(201,164,92,.06) 40%,rgba(201,164,92,0) 70%);opacity:0;animation:kbHalo .8s ease-out .05s forwards}
  #boot .logo{position:relative;width:min(78vw,340px);aspect-ratio:2.75/1;border-radius:20px;overflow:hidden;border:1px solid rgba(201,164,92,.75);
        box-shadow:0 0 0 4px rgba(201,164,92,.08),0 18px 40px rgba(0,0,0,.45);background:#0b1e5c;opacity:0;transform:scale(.9);filter:blur(6px);
        animation:kbLogo .6s cubic-bezier(.2,.8,.2,1) .05s forwards,kbBreathe 3.6s ease-in-out 1.5s infinite}
  #boot .logo img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.12);filter:saturate(1.3) contrast(1.06) brightness(1.04)}
  #boot .shine{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 100%);
        transform:translateX(-140%) skewX(-18deg);animation:kbShine .7s ease-in-out .4s forwards}
  #boot .rule{height:1px;width:0;margin:26px 0 20px;background:linear-gradient(90deg,transparent,rgba(201,164,92,.95),transparent);animation:kbRule .5s cubic-bezier(.2,.8,.2,1) .45s forwards}
  #boot .brand{display:flex;align-items:center;gap:16px;direction:rtl}
  #boot .w{font-family:'Suez One',serif;font-size:25px;letter-spacing:6px;background:linear-gradient(180deg,#f6e2a8 0%,#c9a45c 100%);
        -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0;transform:translateY(8px);filter:blur(4px);animation:kbWord .45s cubic-bezier(.2,.8,.2,1) forwards}
  #boot .b{width:1.5px;height:0;background:linear-gradient(180deg,transparent,rgba(201,164,92,.9),transparent);border-radius:1px;animation:kbBar .3s ease-out forwards}
  #boot .w1{animation-delay:.6s} #boot .b1{animation-delay:.74s} #boot .w2{animation-delay:.8s} #boot .b2{animation-delay:.94s} #boot .w3{animation-delay:1s}
  #boot.out{animation:kbOut .3s ease-in forwards;pointer-events:none}
  @keyframes kbHalo{to{opacity:1}}
  @keyframes kbLogo{to{opacity:1;transform:scale(1);filter:blur(0)}}
  @keyframes kbBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @keyframes kbShine{to{transform:translateX(320%) skewX(-18deg)}}
  @keyframes kbRule{to{width:min(60vw,220px)}}
  @keyframes kbWord{to{opacity:1;transform:none;filter:blur(0);letter-spacing:.3px}}
  @keyframes kbBar{to{height:22px}}
  @keyframes kbOut{to{opacity:0;transform:scale(1.04)}}
  @media (prefers-reduced-motion: reduce){#boot *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
  #boot .err{color:#f2ecdf;max-width:320px;text-align:center;line-height:1.6;font-size:14px;direction:rtl;margin-top:22px}
</style>
</head>

<script>
window.storage = {
  async get(k){const v=localStorage.getItem("kmt:"+k);if(v===null)throw new Error("not found");return{key:k,value:v};},
  async set(k,v){localStorage.setItem("kmt:"+k,v);return{key:k,value:v};},
  async delete(k){localStorage.removeItem("kmt:"+k);return{key:k,deleted:true};},
  async list(p=""){const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("kmt:"+p))ks.push(k.slice(4));}return{keys:ks};}
};
window.KMT_T0 = Date.now();
window.onerror = function(m){ var b=document.getElementById("boot"); if(b){ b.classList.remove("out"); b.innerHTML='<div class="err">שגיאה בטעינה:<br>'+m+'</div>'; } };
// ask the browser to keep this app's data even when storage runs low
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
</script>

<script>
(function(){
  // the opening screen stays for its whole animation, and longer while the app is still starting
  var b = document.getElementById("boot");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var MIN = reduce ? 500 : 1500, MAX = 9000;
  var root = document.getElementById("root");
  var started = function(){ return root.childNodes.length > 0; };
  var booting = function(){ return !!root.querySelector("[data-kmt-boot]"); };
  var done = false;
  var hide = function(){ if (done || !b) return; done = true; b.classList.add("out"); setTimeout(function(){ b.remove(); }, 310); };
  var t = setInterval(function(){
    var el = Date.now() - window.KMT_T0;
    if (!b.isConnected || b.querySelector(".err")) { clearInterval(t); return; }
    if (started() && el >= MIN && (!booting() || el >= MAX)) { clearInterval(t); hide(); return; }
    if (!started() && el > 6000) { clearInterval(t); b.innerHTML = '<div class="err">האפליקציה לא נטענה. רענן את הדף.</div>'; }
  }, 50);
  if ("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();
// A newer version on the server: right after opening, load it at once; while
// the app is in use, offer it with a bar at the top (an app on the home screen
// can stay open in the background for days).
(function(){
  var opened = Date.now(), shown = false;
  function reload(){
    try { sessionStorage.setItem("kmt-reloaded-for", String(latest)); } catch (e) {}
    var go = function(){ location.reload(); };
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(function(r){ return r && r.update(); }).then(go, go); else go();
  }
  var latest = 0;
  function bar(){
    if (shown) return; shown = true;
    var d = document.createElement("button");
    d.textContent = "יש גרסה חדשה לאפליקציה · לחץ לעדכון";
    d.setAttribute("style", "position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);z-index:9999;background:#c9a45c;color:#0e1a2b;border:none;border-radius:20px;padding:10px 18px;font:700 14px Heebo,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.35);direction:rtl;cursor:pointer");
    d.onclick = reload;
    document.body.appendChild(d);
  }
  function check(){
    fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if (!j || !(j.v > window.KMT_VERSION)) return;
      latest = j.v;
      var done = null; try { done = sessionStorage.getItem("kmt-reloaded-for"); } catch (e) {}
      if (Date.now() - opened < 8000 && done !== String(j.v)) reload(); else bar();
    }).catch(function(){});
  }
  check();
  setInterval(check, 3 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") check(); });
})();
</script>
